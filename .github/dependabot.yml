version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/webapp-runner-9"
      - "/webapp-runner-10"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "tomcat.version"
        update-types: ["version-update:semver-major"]
    labels:
      - "skip changelog"
      - "dependencies"
    groups:
      maven-dependencies:
        update-types:
          - "minor"
          - "patch"
        group-by: dependency-name
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "skip changelog"
      - "dependencies"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
